name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart_task_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: smart_task_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_task_ci -d smart_task_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://smart_task_ci:isolated-ci-only@localhost:5432/smart_task_test
      DIRECT_URL: postgresql://smart_task_ci:isolated-ci-only@localhost:5432/smart_task_test
      TEST_DATABASE_URL: postgresql://smart_task_ci:isolated-ci-only@localhost:5432/smart_task_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
